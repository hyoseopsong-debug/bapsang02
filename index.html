<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘의 밥상</title>
  <style>
    :root {
      --hanji: #f6eedd;
      --hanji-dark: #eadcbf;
      --wood-light: #a8693a;
      --wood: #8a5129;
      --wood-dark: #5e3418;
      --card: #fffaf0;
      --ink: #3b2414;
      --accent: #b8452f;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      padding: 40px 16px;
      background:
        radial-gradient(circle at 20% 15%, rgba(255,255,255,.6), transparent 40%),
        radial-gradient(circle at 80% 85%, rgba(200,160,110,.18), transparent 45%),
        var(--hanji);
      color: var(--ink);
      font-family: "Nanum Myeongjo", "Batang", "AppleMyungjo", serif;
    }

    header { text-align: center; }

    h1 {
      font-size: clamp(2rem, 6vw, 2.8rem);
      letter-spacing: .2em;
      color: var(--wood-dark);
    }

    h1::after {
      content: "";
      display: block;
      width: 48px;
      height: 3px;
      margin: 12px auto 0;
      background: var(--accent);
      border-radius: 2px;
    }

    .date {
      margin-top: 10px;
      font-size: .95rem;
      color: #7a5a3c;
    }

    /* 둥근 상 (소반) */
    .soban {
      position: relative;
      width: min(520px, 90vw);
      aspect-ratio: 1;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 30%, rgba(255,255,255,.18), transparent 55%),
        repeating-radial-gradient(circle at 50% 50%,
          var(--wood) 0 6px, var(--wood-light) 6px 9px, var(--wood) 9px 14px),
        var(--wood);
      border: 14px solid var(--wood-dark);
      box-shadow:
        inset 0 0 30px rgba(0,0,0,.35),
        0 18px 0 -4px #4a2812,
        0 30px 40px rgba(60,30,10,.35);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 반찬 목록 */
    .banchan {
      list-style: none;
      width: 78%;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-content: center;
      gap: 14px;
    }

    .banchan li {
      width: 104px;
      padding: 16px 8px 14px;
      background: var(--card);
      border-radius: 16px;
      border: 2px solid var(--hanji-dark);
      box-shadow: 0 6px 12px rgba(40,20,5,.35);
      text-align: center;
      font-size: 1.05rem;
      font-weight: 700;
      transition: transform .2s ease;
    }

    .banchan li:hover { transform: translateY(-4px) rotate(-2deg); }

    .banchan li span {
      display: block;
      font-size: 2.6rem;
      line-height: 1.2;
      margin-bottom: 6px;
    }

    footer {
      font-size: .9rem;
      color: #8a6a4a;
    }

    @media (max-width: 420px) {
      .banchan { gap: 8px; width: 84%; }
      .banchan li { width: 80px; padding: 10px 4px; font-size: .9rem; }
      .banchan li span { font-size: 2rem; }
    }
  </style>
</head>
<body>
  <header>
    <h1>오늘의 밥상</h1>
    <p class="date" id="date"></p>
  </header>

  <main class="soban">
    <!--
      ▼ 반찬 목록 ▼
      한 줄씩 복사해서 이모지와 이름만 바꾸면 반찬이 추가돼요.
      예) <li><span>🥚</span>계란말이</li>
          <li><span>🐟</span>고등어구이</li>
          <li><span>🥬</span>시금치나물</li>
    -->
    <ul class="banchan">
      <li><span>🍚</span>밥</li>
      <li><span>🍲</span>국</li>
      <li><span>🥬</span>김치</li>
      <li><span>🍖</span>돈까스</li>
      <li><span>🐟</span>꽁치</li>
      <li><span>🥩</span>불고기</li>
    </ul>
  </main>

  <footer>잘 먹겠습니다 🙏</footer>

  <script>
    const d = new Date();
    const days = ["일", "월", "화", "수", "목", "금", "토"];
    document.getElementById("date").textContent =
      `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일 ${days[d.getDay()]}요일`;
  </script>
</body>
</html>
